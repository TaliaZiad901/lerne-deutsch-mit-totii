<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darf ich Game</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#9C27B0,#673AB7);
text-align:center;
color:white;
}

#game{
padding:30px;
}

h1{
font-size:40px;
}

.character{
display:inline-block;
background:white;
color:black;
width:150px;
padding:15px;
margin:15px;
border-radius:20px;
cursor:pointer;
transition:.3s;
}

.character:hover{
transform:scale(1.08);
background:#FFD54F;
}

.character img{
width:100px;
height:100px;
border-radius:50%;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:15px;
background:#FFD54F;
cursor:pointer;
margin:10px;
font-weight:bold;
}

button:hover{
background:orange;
}

.card{
background:white;
color:black;
width:85%;
margin:auto;
padding:20px;
border-radius:20px;
}

input{
padding:15px;
font-size:20px;
border-radius:10px;
border:2px solid purple;
width:80%;
text-align:center;
}

#msg{
font-size:22px;
font-weight:bold;
}

</style>

</head>

<body>

<div id="game">

<h1>🎮 Darf ich? Game 🇩🇪</h1>

<h2>🏆 Choose Your Character</h2>

<div class="character" onclick="choose('girl')">

<img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Anna">

<h3>👧 Anna</h3>

</div>

<div class="character" onclick="choose('boy')">

<img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Max">

<h3>👦 Max</h3>

</div>

<p id="selected">No Character Selected</p>

<button onclick="startGame()">
▶ Start Game
</button>

</div>

<script>

let player="";
let score=100;
let current=0;

const questions=[

/* CHOOSE */

{
type:"mc",
question:"🍎 Was bedeutet 'Darf ich essen?'",
options:[
"Can I eat?",
"Can I drink?",
"Can I go to the bathroom?"
],
correct:0
},

{
type:"mc",
question:"🥤 Was bedeutet 'Darf ich trinken?'",
options:[
"Can I eat?",
"Can I drink?",
"Good morning."
],
correct:1
},

{
type:"mc",
question:"🚽 'Toilette bitte' bedeutet ...",
options:[
"Bathroom, please.",
"Water, please.",
"Food, please."
],
correct:0
},

{
type:"mc",
question:"🚿 Was bedeutet 'Darf ich ins Bad gehen?'",
options:[
"Can I eat?",
"Can I go to the bathroom?",
"Can I drink?"
],
correct:1
},

{
type:"mc",
question:"🍕 'Darf ich essen?'",
options:[
"Can I eat?",
"Can I sleep?",
"Can I drink?"
],
correct:0
},

/* COMPLETE */

{
type:"complete",
question:"🍎 Darf ich ______?",
answer:"essen"
},

{
type:"complete",
question:"🥤 Darf ich ______?",
answer:"trinken"
},

{
type:"complete",
question:"🚽 Toilette ______.",
answer:"bitte"
},

{
type:"complete",
question:"🚿 Darf ich ins ______ gehen?",
answer:"Bad"
},

{
type:"complete",
question:"🍎 Darf ich ______ essen?",
answer:"etwas"
},

/* MORE CHOOSE */

{
type:"mc",
question:"🍽️ What does 'essen' mean?",
options:[
"eat",
"drink",
"go"
],
correct:0
},

{
type:"mc",
question:"🥤 What does 'trinken' mean?",
options:[
"eat",
"drink",
"sit"
],
correct:1
},

{
type:"mc",
question:"🚽 What does 'Toilette' mean?",
options:[
"School",
"Bathroom / Toilet",
"House"
],
correct:1
},

{
type:"mc",
question:"🏠 Was bedeutet 'Bad'?",
options:[
"Bathroom",
"Food",
"Water"
],
correct:0
},

{
type:"mc",
question:"🙏 Was bedeutet 'bitte'?",
options:[
"Please",
"Goodbye",
"Thanks"
],
correct:0
}

];


function choose(name){

player=name;

document.getElementById("selected").innerHTML=
"✅ Character Selected";

}


function startGame(){

if(player==""){

alert("Choose your character first!");

return;

}

score=100;
current=0;

showQuestion();

}


function showQuestion(){

let q=questions[current];

let html="";


if(q.type=="mc"){

html=q.options.map((option,index)=>

`<button onclick="checkMC(${index})">
${option}
</button><br>`

).join("");

}


if(q.type=="complete"){

html=`

<input
id="answer"
type="text"
placeholder="Write your answer here">

<br>

<button onclick="checkComplete()">
✅ Check Answer
</button>

`;

}


document.getElementById("game").innerHTML=`

<h1>🎮 Darf ich? Game 🇩🇪</h1>

<h2>⭐ Score: ${score}/100</h2>

<h2>📚 Question ${current+1} / ${questions.length}</h2>

<div class="card">

<h2>${q.question}</h2>

${html}

</div>

<p id="msg"></p>

`;

}


function checkMC(choice){

let q=questions[current];

if(choice==q.correct){

correctAnswer();

}else{

wrongAnswer(q.options[q.correct]);

}

}


function checkComplete(){

let q=questions[current];

let answer=document
.getElementById("answer")
.value
.trim()
.toLowerCase();

let correct=q.answer
.toLowerCase();

if(answer==correct){

correctAnswer();

}else{

wrongAnswer(q.answer);

}

}


function correctAnswer(){

document.getElementById("msg").innerHTML=
"🎉 Correct!";

setTimeout(nextQuestion,1000);

}


function wrongAnswer(correct){

score-=7;

document.getElementById("msg").innerHTML=
"❌ Wrong!<br>✅ Correct Answer: "+correct;

setTimeout(nextQuestion,2000);

}


function nextQuestion(){

current++;

if(current<questions.length){

showQuestion();

}else{

finishGame();

}

}


function finishGame(){

document.getElementById("game").innerHTML=`

<h1>🏆 Game Finished!</h1>

<h2>Your Score</h2>

<h1>${score}/100</h1>

<p>${
score==100
?
"🥇 Perfect! You are amazing!"
:
score>=90
?
"🌟 Excellent!"
:
score>=70
?
"👏 Very Good!"
:
score>=50
?
"😊 Good!"
:
"💪 Keep Practicing!"
}</p>

<button onclick="location.reload()">
🔄 Play Again
</button>

`;

}

</script>

</body>
</html>
