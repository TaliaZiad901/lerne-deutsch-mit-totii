<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>German Review Game</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#9C27B0,#673AB7);
text-align:center;
color:white;
}

#startScreen{
padding:30px;
}

h1{
font-size:40px;
}

.character{
display:inline-block;
background:white;
color:black;
width:150px;
padding:15px;
margin:15px;
border-radius:20px;
cursor:pointer;
transition:.3s;
}

.character:hover{
transform:scale(1.08);
background:#ffe082;
}

.character img{
width:100px;
height:100px;
border-radius:50%;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:15px;
background:#FFD54F;
cursor:pointer;
margin:10px;
font-weight:bold;
}

button:hover{
background:orange;
}

input{
padding:15px;
font-size:20px;
border-radius:10px;
border:2px solid purple;
width:80%;
text-align:center;
}

#words button{
background:white;
color:black;
}

#answerBox{
font-size:24px;
font-weight:bold;
min-height:35px;
}

#msg{
font-size:24px;
font-weight:bold;
}

</style>

</head>

<body>


<div id="startScreen">

<h1>🎮 German Review Game 🇩🇪</h1>

<h2>🏆 Review the Last 10 Lessons</h2>


<div class="character" onclick="choose('girl')">

<img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Anna">

<h3>👧 Anna</h3>

</div>


<div class="character" onclick="choose('boy')">

<img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Max">

<h3>👦 Max</h3>

</div>


<p id="selected">No Character Selected</p>


<button onclick="startGame()">
▶ Start Game
</button>

</div>


<script>

let player="";

let score=100;

let current=0;

let selectedWords=[];


const questions=[


/* ================= 1-5 CHOOSE ================= */


{
type:"mc",

question:"😊 Wie geht's dir?",

options:[
"Mir geht's gut.",
"Ich wohne in Kairo.",
"Ich komme aus Ägypten.",
"Ich heiße Anna."
],

correct:"Mir geht's gut."
},


{
type:"mc",

question:"🌍 Woher kommst du?",

options:[
"Ich wohne in Kairo.",
"Ich komme aus Ägypten.",
"Mir geht's gut.",
"Ich bin zehn Jahre alt."
],

correct:"Ich komme aus Ägypten."
},


{
type:"mc",

question:"🏠 Wo wohnst du?",

options:[
"Ich komme aus Ägypten.",
"Mir geht's gut.",
"Ich wohne in Kairo.",
"Ich heiße Anna."
],

correct:"Ich wohne in Kairo."
},


{
type:"mc",

question:"🇩🇪 Was ist die Hauptstadt von Deutschland?",

options:[
"Paris",
"Berlin",
"Madrid",
"Rom"
],

correct:"Berlin"
},


{
type:"mc",

question:"🪑 Was ist das?",

options:[
"die Brille",
"der Stuhl",
"das Geld",
"die Tasche"
],

correct:"der Stuhl"
},


/* ================= 6-10 REARRANGE ================= */


{
type:"rearrange",

question:"🔄 Arrange the words:",

words:["geht's","Wie","dir"],

answer:"Wie geht's dir?"
},


{
type:"rearrange",

question:"🔄 Arrange the words:",

words:["kommst","Woher","du"],

answer:"Woher kommst du?"
},


{
type:"rearrange",

question:"🔄 Arrange the words:",

words:["wohnst","Wo","du"],

answer:"Wo wohnst du?"
},


{
type:"rearrange",

question:"🔄 Arrange the words:",

words:["komme","Ich","Ägypten","aus"],

answer:"Ich komme aus Ägypten."
},


{
type:"rearrange",

question:"🔄 Arrange the words:",

words:["wohne","Ich","Kairo","in"],

answer:"Ich wohne in Kairo."
},


/* ================= 11-15 WRITING ================= */


{
type:"writing",

question:"✍️ Write 'I am fine' in German.",

answer:"Mir geht's gut."
},


{
type:"writing",

question:"✍️ Write 'I come from Egypt' in German.",

answer:"Ich komme aus Ägypten."
},


{
type:"writing",

question:"✍️ Write 'I live in Cairo' in German.",

answer:"Ich wohne in Kairo."
},


{
type:"writing",

question:"✍️ Write 'Can I go to the bathroom?' in German.",

answer:"Darf ich ins Bad gehen?"
},


{
type:"writing",

question:"✍️ Write 'Bathroom, please' in German.",

answer:"Toilette, bitte."
},


/* ================= 16-20 MATCH ================= */


{
type:"match",

question:"🔗 Match: Deutschland 🇩🇪",

options:[
"Berlin",
"Paris",
"Madrid",
"Rom"
],

correct:"Berlin"
},


{
type:"match",

question:"🔗 Match: Frankreich 🇫🇷",

options:[
"Berlin",
"Paris",
"Madrid",
"Rom"
],

correct:"Paris"
},


{
type:"match",

question:"🔗 Match: Spanien 🇪🇸",

options:[
"Berlin",
"Paris",
"Madrid",
"Rom"
],

correct:"Madrid"
},


{
type:"match",

question:"🔗 Match: die Brille 👓",

options:[
"📖 Book",
"👓 Glasses",
"🎒 Bag",
"💵 Money"
],

correct:"👓 Glasses"
},


{
type:"match",

question:"🔗 Match: das Geld 💵",

options:[
"🪑 Chair",
"💵 Money",
"📖 Book",
"👓 Glasses"
],

correct:"💵 Money"
},


/* ================= 21-25 TRANSLATE ================= */


{
type:"writing",

question:"🌍 Translate: 'What is your name?'",

answer:"Wie heißt du?"
},


{
type:"writing",

question:"🌍 Translate: 'How old are you?'",

answer:"Wie alt bist du?"
},


{
type:"writing",

question:"🌍 Translate: 'I am ten years old'",

answer:"Ich bin zehn Jahre alt."
},


{
type:"writing",

question:"🌍 Translate: 'Good morning'",

answer:"Guten Morgen"
},


{
type:"writing",

question:"🌍 Translate: 'Goodbye'",

answer:"Tschüss"
},


/* ================= 26-30 THINGS ================= */


{
type:"mc",

question:"👓 Was ist das?",

options:[
"die Brille",
"das Buch",
"der Stuhl",
"das Geld"
],

correct:"die Brille"
},


{
type:"mc",

question:"📖 Was ist das?",

options:[
"die Tasche",
"das Buch",
"die Brille",
"das Geld"
],

correct:"das Buch"
},


{
type:"mc",

question:"🎒 Was ist das?",

options:[
"der Stuhl",
"die Tasche",
"das Buch",
"die Brille"
],

correct:"die Tasche"
},


{
type:"mc",

question:"💵 Was ist das?",

options:[
"das Geld",
"der Sessel",
"das Buch",
"die Brille"
],

correct:"das Geld"
},


{
type:"mc",

question:"🛋️ Was ist das?",

options:[
"der Sessel",
"die Tasche",
"der Stuhl",
"das Heft"
],

correct:"der Sessel"
}

];


function choose(name){

player=name;

document.getElementById("selected").innerHTML=
"✅ Character Selected";

}


function startGame(){

if(player==""){

alert("Choose your character first!");

return;

}

score=100;

current=0;

showQuestion();

}


function showQuestion(){

let q=questions[current];

selectedWords=[];

let html="";


/* ================= MULTIPLE CHOICE ================= */

if(q.type=="mc"){

html=q.options.map(option=>

`<button onclick="checkMC('${option.replace(/'/g,"\\'")}')">

${option}

</button><br>`

).join("");

}


/* ================= REARRANGE ================= */

else if(q.type=="rearrange"){

html=`

<div id="words">

${q.words.map((word,index)=>

`<button onclick="addWord('${word}',${index})">

${word}

</button>`

).join("")}

</div>


<h3 id="answerBox"></h3>


<button onclick="undoWord()">

↩️ Undo

</button>


<button onclick="clearWords()">

🗑️ Clear

</button>


<br>


<button onclick="checkRearrange()">

✅ Check Answer

</button>

`;

}


/* ================= WRITING ================= */

else if(q.type=="writing"){

html=`

<input id="writingAnswer"

type="text"

placeholder="Write your answer here">


<br>


<button onclick="checkWriting()">

✅ Check Answer

</button>

`;

}


/* ================= MATCH ================= */

else if(q.type=="match"){

html=q.options.map(option=>

`<button onclick="checkMatch('${option.replace(/'/g,"\\'")}')">

${option}

</button><br>`

).join("");

}


document.getElementById("startScreen").innerHTML=`

<h1>🎮 German Review Game 🇩🇪</h1>

<h2>⭐ Score: ${score}/100</h2>

<h2>📚 Question ${current+1} / ${questions.length}</h2>


<div style="background:white;color:black;padding:20px;border-radius:20px;width:85%;margin:auto;">

<h2>${q.question}</h2>

${html}

</div>


<p id="msg"></p>

`;

}


/* ================= MC ================= */

function checkMC(answer){

let q=questions[current];

if(answer.toLowerCase()==q.correct.toLowerCase()){

correctAnswer();

}else{

wrongAnswer(q.correct);

}

}


/* ================= MATCH ================= */

function checkMatch(answer){

let q=questions[current];

if(answer.toLowerCase()==q.correct.toLowerCase()){

correctAnswer();

}else{

wrongAnswer(q.correct);

}

}


/* ================= REARRANGE ================= */

function addWord(word,index){

selectedWords.push(word);

document.getElementById("answerBox").innerHTML=

selectedWords.join(" ");

}


function undoWord(){

if(selectedWords.length>0){

selectedWords.pop();

document.getElementById("answerBox").innerHTML=

selectedWords.join(" ");

}

}


function clearWords(){

selectedWords=[];

document.getElementById("answerBox").innerHTML="";

}


function checkRearrange(){

let q=questions[current];

let answer=selectedWords.join(" ");


let correctAnswerText=q.answer

.toLowerCase()

.replace(/[.!?]/g,"")

.trim();


let userAnswer=answer

.toLowerCase()

.replace(/[.!?]/g,"")

.trim();


if(userAnswer==correctAnswerText){

correctAnswer();

}else{

wrongAnswer(q.answer);

}

}


/* ================= WRITING ================= */

function checkWriting(){

let q=questions[current];


let answer=document

.getElementById("writingAnswer")

.value

.trim()

.toLowerCase()

.replace(/[.!?]/g,"");


let correct=q.answer

.toLowerCase()

.replace(/[.!?]/g,"");


if(answer==correct){

correctAnswer();

}else{

wrongAnswer(q.answer);

}

}


/* ================= CORRECT ================= */

function correctAnswer(){

document.getElementById("msg").innerHTML=

"🎉 Correct!";


setTimeout(nextQuestion,1000);

}


/* ================= WRONG ================= */

function wrongAnswer(correct){

score-=3;


if(score<0){

score=0;

}


document.getElementById("msg").innerHTML=

"❌ Wrong!<br>✅ Correct Answer: "+

correct;


setTimeout(nextQuestion,2000);

}


/* ================= NEXT ================= */

function nextQuestion(){

current++;


if(current<questions.length){

showQuestion();

}else{

finishGame();

}

}


/* ================= FINISH ================= */

function finishGame(){

document.getElementById("startScreen").innerHTML=`

<h1>🏆 Game Finished!</h1>

<h2>Your Score</h2>

<h1>${score}/100</h1>


<p>

${
score==100

?

"🥇 Perfect! You are amazing!"

:

score>=90

?

"🌟 Excellent!"

:

score>=70

?

"👏 Very Good!"

:

score>=50

?

"😊 Good!"

:

"💪 Keep Practicing!"

}

</p>


<button onclick="location.reload()">

🔄 Play Again

</button>

`;

}

</script>

</body>

</html>
